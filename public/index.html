<!DOCTYPE html>
<html>

<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="app-header"></div>

    <main class="page">
        <div class="quiz-container" id="quiz"></div>

        <div class="button-group">
            <button class="btn btn-primary submit-btn" id="submitBtn" onclick="submitAnswers()">Submit</button>
            <button class="btn btn-secondary refresh-btn" onclick="window.location.reload()">Refresh</button>
        </div>
    </main>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="scoreSummary">Your Score</h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div id="resultsPage" class="card"></div>
            <div class="pager" id="resultsPager">
                <button type="button" class="btn btn-secondary pager-btn" id="prevPage" onclick="prevPage()">‹ Prev</button>
                <span class="page-indicator" id="pageIndicator"></span>
                <button type="button" class="btn btn-secondary pager-btn" id="nextPage" onclick="nextPage()">Next ›</button>
            </div>
        </div>
    </div>

    <script src="header.js"></script>
    <script src="app.js"></script>
    <script src="footer.js"></script>
</body>

</html>

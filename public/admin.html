<!DOCTYPE html>
<html>

<head>
  <title>Admin · Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="card">
      <h2>Admin Panel</h2>
      <h3>Upload Excel File</h3>
      <p class="hint">Uploading replaces the entire question bank.</p>
      <input type="file" id="excel" accept=".xlsx,.xls" class="file-input">
      <button class="btn btn-primary" onclick="uploadFile()">Upload</button>
      <p class="form-msg" id="msg"></p>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>User Scores</h3>
        <button class="btn btn-secondary" onclick="loadScores()">Refresh</button>
      </div>
      <div id="scoresBody"></div>
    </div>
  </main>

  <script src="header.js"></script>
  <script>
    async function uploadFile() {
      const msg = document.getElementById("msg");
      const file = document.getElementById("excel").files[0];
      if (!file) {
        msg.textContent = "Please choose a file first.";
        msg.className = "form-msg error";
        return;
      }

      const form = new FormData();
      form.append("file", file);

      const res = await fetch("/api/admin/upload", {
        method: "POST",
        headers: { Authorization: "Bearer " + localStorage.getItem("token") },
        body: form,
      });

      if (!res.ok) {
        msg.textContent =
          res.status === 403 ? "Admin access required." : "Upload failed.";
        msg.className = "form-msg error";
        return;
      }

      const data = await res.json();
      msg.textContent = data.message;
      msg.className = "form-msg ok";
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(s) {
      if (!s) return "";
      const d = new Date(String(s).replace(" ", "T") + "Z");
      return isNaN(d.getTime()) ? String(s) : d.toLocaleString();
    }

    async function loadScores() {
      const body = document.getElementById("scoresBody");
      body.innerHTML = "<p class='hint'>Loading…</p>";
      try {
        const res = await fetch("/api/questions/scores", {
          headers: { Authorization: "Bearer " + localStorage.getItem("token") },
        });
        if (!res.ok) {
          body.innerHTML =
            "<p class='form-msg error'>" +
            (res.status === 403
              ? "Admin access required."
              : "Failed to load scores.") +
            "</p>";
          return;
        }
        renderScores(await res.json());
      } catch (e) {
        body.innerHTML = "<p class='form-msg error'>Failed to load scores.</p>";
      }
    }

    function renderScores(rows) {
      const body = document.getElementById("scoresBody");
      if (!rows.length) {
        body.innerHTML = "<p class='hint'>No attempts yet.</p>";
        return;
      }
      const rowsHtml = rows
        .map((r) => {
          const pct = r.total > 0 ? Math.round((r.score / r.total) * 100) : 0;
          return `
            <tr>
              <td>${escapeHtml(r.username)}</td>
              <td>${escapeHtml(r.score)} / ${escapeHtml(r.total)}</td>
              <td class="num">${pct}%</td>
              <td>${escapeHtml(formatDate(r.takenAt))}</td>
            </tr>`;
        })
        .join("");
      body.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>User</th><th>Score</th><th class="num">%</th><th>Date</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>`;
    }

    loadScores();
  </script>
</body>

</html>
